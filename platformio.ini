; PlatformIO Project Configuration File
;
; Ultra-Fast Modbus Encoder Reader
; 超高频6编码器批量读取系统
;
; 优化配置说明：
; - 使用ESP32 240MHz主频
; - 启用编译器优化（-O3）
; - 启用浮点硬件加速
; - 增大栈空间以支持FreeRTOS任务

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; 优化：使用最高主频
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L

; 优化：编译器优化选项
build_flags = 
    -O3                          ; 最高优化级别
    -DCORE_DEBUG_LEVEL=0         ; 关闭调试信息以提高性能
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=8192  ; 增大loop栈空间
    -DCONFIG_FREERTOS_HZ=1000    ; FreeRTOS tick频率1000Hz
    -ffast-math                  ; 快速数学运算
    -funroll-loops               ; 循环展开
    -ftree-vectorize             ; 向量化优化

; 串口配置
monitor_speed = 2000000
monitor_filters = 
    esp32_exception_decoder
    time

; 上传配置
upload_speed = 921600

; 依赖库
lib_deps = 
    emelianov/modbus-esp8266@^4.1.0
    fastled/FastLED@^3.6.0

; 调试配置（可选）
; debug_tool = esp-prog
; debug_init_break = tbreak setup
