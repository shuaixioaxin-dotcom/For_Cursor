; PlatformIO Project Configuration File
; 优化配置用于达到200Hz IMU数据读取频率

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; 优化编译选项
build_flags = 
    -O2
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=0

; 串口监视器配置
monitor_speed = 2000000
monitor_filters = direct

; 上传速度
upload_speed = 921600

; 库依赖（如果需要）
lib_deps = 
