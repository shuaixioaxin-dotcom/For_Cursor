; PlatformIO Project Configuration File
;
; IMU数据采集系统 - 200Hz高频优化版本
;
; 构建命令: pio run
; 上传命令: pio run --target upload
; 监视器: pio device monitor

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; 串口配置
monitor_speed = 921600
monitor_filters = 
    default
    time

; 构建优化
build_flags = 
    -O2                     ; 优化级别2
    -DCORE_DEBUG_LEVEL=0    ; 禁用调试输出以提升性能

; 上传配置
upload_speed = 921600
