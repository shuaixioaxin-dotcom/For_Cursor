[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; 编译选项
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

; 库依赖
lib_deps = 
    espressif/esp32@^2.0.0

; 上传配置
upload_speed = 921600
monitor_filters = esp32_exception_decoder
